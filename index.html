<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MANGALSINGH | Professional PDF Tool</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;700&display=swap');
        
        :root { --accent: #ff4d1c; --ink: #000; --paper: #fdfaf5; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
        body { background: var(--paper); color: var(--ink); }

        /* --- AUTH SCREEN --- */
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--paper); z-index: 2000; display: flex; align-items: center; justify-content: center; transition: 0.8s cubic-bezier(0.8, 0, 0.2, 1); }
        .auth-card { background: #fff; padding: 2.5rem 1.5rem; border-radius: 32px; border: 3px solid var(--ink); box-shadow: 12px 12px 0px var(--ink); width: 90%; max-width: 380px; text-align: center; }
        
        /* --- MAIN UI --- */
        header { padding: 1.2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2.5px solid var(--ink); background: #fff; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Syne'; font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; }
        .user-pill { display: flex; align-items: center; gap: 8px; border: 2px solid var(--ink); padding: 6px 14px; border-radius: 50px; font-weight: 700; font-size: 0.85rem; cursor: pointer; background: #fff; }
        .user-pill img { width: 24px; border-radius: 50%; border: 1px solid var(--ink); }

        .container { max-width: 500px; margin: auto; padding: 2.5rem 1.2rem; text-align: center; }
        .dropzone { border: 3px dashed #d1ccc0; border-radius: 24px; padding: 4rem 1rem; background: #fff; cursor: pointer; margin-bottom: 2.5rem; transition: 0.3s; }
        .dropzone:active { transform: scale(0.96); border-color: var(--accent); }

        /* --- FEEDBACK --- */
        .review-box { background: #fff; padding: 1.5rem; border-radius: 24px; border: 2.5px solid var(--ink); text-align: left; }
        .review-list { max-height: 180px; overflow-y: auto; margin-bottom: 1.2rem; }
        .review-item { padding: 10px 0; border-bottom: 1.5px solid #f0f0f0; font-size: 0.9rem; line-height: 1.4; }
        .review-item b { color: var(--accent); display: block; margin-bottom: 2px; }

        input, textarea { width: 100%; padding: 14px; margin: 10px 0; border: 2.5px solid #eee; border-radius: 14px; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-color: var(--ink); }
        .btn { width: 100%; padding: 14px; background: var(--ink); color: #fff; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-accent { background: var(--accent); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-card">
        <h2 style="font-family:'Syne'; font-size: 1.8rem; margin-bottom: 1.8rem;">MANGAL <span style="color:var(--accent)">PDF</span></h2>
        
        <div id="g_id_onload" data-client_id="952256750591-h5oi07sbio6g0q86acptsktlq85d8pt0.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
        <div class="g_id_signin" data-type="standard" data-shape="pill" data-width="300"></div>

        <p style="margin: 1.5rem 0; color: #aaa; font-weight: 700; font-size: 0.8rem;">OR PHONE LOGIN</p>

        <div id="phoneInputArea">
            <input type="text" id="phoneNo" placeholder="+91 00000 00000">
            <div id="recaptcha-container"></div>
            <button class="btn" onclick="requestOTP()">Get OTP</button>
        </div>

        <div id="otpInputArea" class="hidden">
            <input type="text" id="otpVal" placeholder="Enter 6-digit OTP">
            <button class="btn" style="background:#00c853;" onclick="confirmOTP()">Verify & Login</button>
        </div>
    </div>
</div>

<header>
    <div class="logo">MANGAL<span style="color:var(--accent)">SINGH</span></div>
    <div id="userProfileArea"></div>
</header>

<div class="container">
    <h1 style="font-family:'Syne'; font-size: 2rem; margin-bottom: 0.5rem;">HD PDF Creator</h1>
    <p style="color:#666; margin-bottom: 2rem;">Fast, Secure aur Professional ✅</p>
    
    <div class="dropzone" onclick="document.getElementById('pdfInput').click()">
        <span style="font-size: 3.5rem;">📄</span>
        <p style="font-weight:700; margin-top: 10px;">Select PDF File</p>
    </div>
    <input type="file" id="pdfInput" accept=".pdf" class="hidden">

    <div class="review-box">
        <h3 style="margin-bottom: 1rem; font-family:'Syne';">User Reviews 💬</h3>
        <div id="displayReviews" class="review-list"></div>
        
        <div id="postArea">
            <textarea id="msgBox" placeholder="Write your feedback..."></textarea>
            <button class="btn btn-accent" onclick="submitReview()">Post Review</button>
        </div>
        <div id="successInfo" class="hidden" style="text-align:center; padding: 15px; color:#00c853; font-weight:700;">
            Review posted successfully! ❤️
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyB0fO8KW-dAUXCTIbJ3D7XeL3yG5p9j9Y4",
        authDomain: "mangalpdf-4d665.firebaseapp.com",
        projectId: "mangalpdf-4d665",
        storageBucket: "mangalpdf-4d665.firebasestorage.app",
        messagingSenderId: "709540181234",
        appId: "1:709540181234:web:9cdabc78d17a08e8f00c6b"
    };
    firebase.initializeApp(firebaseConfig);

    let activeUser = null;

    // --- Google Auth ---
    function handleCredentialResponse(res) {
        const payload = JSON.parse(atob(res.credential.split('.')[1]));
        activeUser = { name: payload.name, img: payload.picture, id: payload.email };
        onUserReady();
    }

    // --- Phone Auth ---
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });

    function requestOTP() {
        const num = document.getElementById('phoneNo').value;
        if(!num.includes('+')) return alert("Add +91 before number");
        firebase.auth().signInWithPhoneNumber(num, window.recaptchaVerifier).then(res => {
            window.confirmationResult = res;
            document.getElementById('phoneInputArea').classList.add('hidden');
            document.getElementById('otpInputArea').classList.remove('hidden');
        }).catch(e => alert(e.message));
    }

    function confirmOTP() {
        confirmationResult.confirm(document.getElementById('otpVal').value).then(res => {
            activeUser = { 
                name: "User " + res.user.phoneNumber.slice(-4), 
                img: "https://cdn-icons-png.flaticon.com/512/3177/3177440.png", 
                id: res.user.phoneNumber 
            };
            onUserReady();
        }).catch(() => alert("Wrong OTP!"));
    }

    function onUserReady() {
        document.getElementById('authOverlay').style.transform = 'translateY(-100%)';
        document.getElementById('userProfileArea').innerHTML = `
            <div class="user-pill" onclick="location.reload()">
                <img src="${activeUser.img}"> ${activeUser.name.split(' ')[0]}
            </div>`;
        showReviews();
    }

    // --- Review Logic ---
    function submitReview() {
        const txt = document.getElementById('msgBox').value.trim();
        if(!txt) return;
        let data = JSON.parse(localStorage.getItem('m_data') || '[]');
        data.push({ user: activeUser.name, text: txt, uid: activeUser.id });
        localStorage.setItem('m_data', JSON.stringify(data));
        showReviews();
    }

    function showReviews() {
        let data = JSON.parse(localStorage.getItem('m_data') || '[]');
        const list = document.getElementById('displayReviews');
        const done = data.some(r => r.uid === activeUser.id);
        
        if(done) {
            document.getElementById('postArea').classList.add('hidden');
            document.getElementById('successInfo').classList.remove('hidden');
        }

        list.innerHTML = data.length ? data.reverse().map(r => `
            <div class="review-item"><b>${r.user}</b>${r.text}</div>
        `).join('') : '<p style="font-size:0.8rem; color:#aaa;">No reviews yet.</p>';
    }
</script>
</body>
</html>
